server.port=${SERVER_PORT:8080}

# --- H2 file database (local persistent) ---
# Persistance sur disque: ./data/conges_db.* (ne se supprime pas au restart)
# NOTE: certaines options (AUTO_SERVER...) varient selon versions H2 ; on reste sur une URL compatible.
spring.datasource.url=jdbc:h2:file:./data/conges_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Keep the rest of app settings from application.properties via Spring's property precedence.
