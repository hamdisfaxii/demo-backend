# Profil OPTIONNEL : garder les données locales sans que Hibernate retouche le schéma au démarrage.
# Activez-le APRÈS "dev" pour qu'il écrase ddl-auto (ordre des profils important).
#
# Exemples :
#   SPRING_PROFILES_ACTIVE=dev,devsafe
#   --spring.profiles.active=dev,devsafe
#
# Quand vous ajoutez/supprimez des champs ou tables JPA, passez temporairement en "dev" seul
# (ou définissez JPA_DDL_AUTO=update dans l'environnement), puis revenez à dev,devsafe.
#
spring.jpa.hibernate.ddl-auto=none
