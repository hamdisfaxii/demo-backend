server.port=${SERVER_PORT:8080}

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:conges_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== DOLIBARR API CONFIGURATION =====
dolibarr.url=${DOLIBARR_URL:http://localhost/dolibarr/api/index.php}
dolibarr.api-key=${DOLIBARR_API_KEY:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT SECURITY =====
jwt.secret=${JWT_SECRET:Hf7@kL9#pQ2xZ8!mN5vR3sT6uY}
jwt.expiration=${JWT_EXPIRATION:604800000}

# ===== SMTP EMAIL CONFIGURATION =====
# Gmail SMTP (with App Password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.socketFactory.port=587
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# ===== NOTIFICATION SETTINGS =====
app.notification.from.email=${MAIL_FROM_EMAIL:your-email@gmail.com}
app.notification.from.name=${MAIL_FROM_NAME:Gestion des Congés}
app.notification.enabled=true
app.notification.async=${MAIL_ASYNC:true}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method