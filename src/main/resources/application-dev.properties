# Développement local / Docker Compose : schéma JPA (+ colonnes métier récentes)
# À activer avec : --spring.profiles.active=dev
# Ou variable d'environnement : SPRING_PROFILES_ACTIVE=dev
# (Les fichiers .env ne sont pas lus automatiquement par Spring : à injecter comme variables d'environnement ou dans l'IDE.)
# MySQL XAMPP sans mot de passe : soit ne pas utiliser ce profil, soit forcer SPRING_DATASOURCE_PASSWORD=

spring.jpa.hibernate.ddl-auto=update

# Défaut = mot de passe root du mysql du docker-compose. Si DB_PASSWORD=(vide) existe dans l'environnement, il prime sur :root.
spring.datasource.password=${DB_PASSWORD:root}

# Crée automatiquement la base si elle n'existe pas (utile première installation locale)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:conges_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
