server.port=${SERVER_PORT:8080}

# ===== DATABASE CONFIGURATION =====
# Sans profil "dev", le schéma n'est pas modifié automatiquement (MySQL hors embarqué = none par défaut).
# Pour le local avec Docker : lancer avec spring.profiles.active=dev (voir application-dev.properties).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:conges_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# none = Hibernate ne touche pas au schéma (recommandé sans profil dev). Risqué avec données : éviter create / create-drop.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}

# ===== DOLIBARR API CONFIGURATION =====
dolibarr.url=${DOLIBARR_URL:http://localhost/dolibarr/api/index.php}
# Dolibarr (tables SQL source de vérité pays si même instance MySQL)
dolibarr.database.table-prefix=${DOLIBARR_DB_TABLE_PREFIX:llx_}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT SECURITY =====
jwt.secret=${JWT_SECRET:Hf7@kL9#pQ2xZ8!mN5vR3sT6uY}
jwt.expiration=${JWT_EXPIRATION:604800000}

# ===== SMTP EMAIL CONFIGURATION =====
# Gmail (587) : STARTTLS — ne pas définir mail.smtp.socketFactory.* pour ce port,
# sinon erreurs SSL/handshake (« Couldn't connect », « PKIX », etc.).
# Pour port 465 (SSL implicite) : MAIL_PORT=465 + spring.mail.properties.mail.smtp.ssl.enable=true à la place de starttls.*
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== NOTIFICATION SETTINGS =====
app.notification.from.email=${MAIL_FROM_EMAIL:your-email@gmail.com}
app.notification.from.name=${MAIL_FROM_NAME:Gestion des Congés}
app.notification.enabled=true
app.notification.async=${MAIL_ASYNC:true}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method

# RTT France (ledger local + optionnel bypass consommation Dolibarr sur les courtes)
france.rtt.local-ledger-enabled=true
france.rtt.skip-dolibarr-rtt-consume=true
france.rtt.annual-cron=0 5 0 1 1 *